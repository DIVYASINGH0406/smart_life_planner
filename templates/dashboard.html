<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Dashboard - Smart Life Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Dynamic welcome name -->
        <h1>Welcome, {{ name }}! 🌸</h1>
        <p>Your personal Smart Life Planner</p>
        
        <!-- Logout Button -->
        <a href="{{ url_for('logout') }}" class="logout">Logout</a>

        <div class="cards">
            <!-- Daily Planner Card (Linked to /daily route) -->
            <div class="card" onclick="window.location.href='{{ url_for('daily_planner') }}';">
                <h2>📅 Daily Planner</h2>
                <p>Organize your daily activities.</p>
            </div>

            <!-- Study Planner Card -->
            <div class="card">
                <h2>📚 Study Planner</h2>
                <p>Plan your study sessions and goals.</p>
            </div>

            <!-- Habit Tracker Card -->
            <div class="card">
                <h2>🌱 Habit Tracker</h2>
                <p>Build positive daily habits.</p>
            </div>

            <!-- Reminders Card -->
            <div class="card">
                <h2>⏰ Reminders</h2>
                <p>Keep track of important tasks.</p>
            </div>
        </div>
    </div>
</body>
</html>
